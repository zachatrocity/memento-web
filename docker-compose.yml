version: '3.8'

services:
  memento-web:
    # Use pre-built image (recommended)
    image: ghcr.io/zachatrocity/memento-web:latest
    
    # Or build locally (for development):
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    
    container_name: memento-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/callback}
      - SESSION_SECRET=${SESSION_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - OUTPUT_DIR=/app/data/output
      - MUSIC_DIR=/music
      - PHOTO_DURATION_SECONDS=${PHOTO_DURATION_SECONDS:-4}
      - TRANSITION_DURATION_SECONDS=${TRANSITION_DURATION_SECONDS:-1}
      - VIDEO_QUALITY=${VIDEO_QUALITY:-high}
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
    volumes:
      - ./data:/app/data
      - ${MUSIC_DIR:-./music}:/music:ro
      - /tmp:/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

